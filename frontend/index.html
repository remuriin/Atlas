<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Atlas is a hub for study reviewers made and shared by learners. Browse notes and study guides, and upvote the ones that help." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Atlas</title>
    <script>
      // Runs before the page is drawn, so the right theme shows from the very
      // first frame (no flash of the wrong colors). A saved choice wins;
      // otherwise the device's light/dark setting is used.
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('atlas-theme');
          // Choices saved before the site was renamed from LearnHub used this key.
          if (!theme) {
            theme = window.localStorage.getItem('learnhub-theme');
          }
        } catch (err) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <noscript>Atlas needs JavaScript to run. Please turn it on in your browser settings.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
